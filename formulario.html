<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de estudiantes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 40px 16px;
        }

        .tarjeta {
            max-width: 480px;
            margin: auto;
            background: #fff;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        }

        h1 {
            color: #1f3a5f;
            font-size: 1.5rem;
            margin-top: 0;
        }

        p.intro {
            color: #555;
            margin-top: -6px;
        }

        .campo {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 1rem;
        }

        input:focus {
            outline: 2px solid #1f6feb;
            border-color: #1f6feb;
        }

        .botones {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
        }

        .btn-get {
            background: #1f6feb;
        }

        .btn-get:hover {
            background: #1558c0;
        }

        .btn-post {
            background: #2e8b57;
        }

        .btn-post:hover {
            background: #226b43;
        }
    </style>
</head>

<body>
    <div class="tarjeta">
        <h1>Registro de estudiantes</h1>
        <p class="intro">Complete los datos y elija cómo enviarlos al servidor.</p>

                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Ej: Pérez">
            </div>
